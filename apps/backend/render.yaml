services:
  - type: web
    name: musicas-missa-backend
    env: node
    region: ohio
    plan: free
    buildCommand: npm run build --workspace=apps/backend
    startCommand: npm run start --workspace=apps/backend
    envVars:
      - key: PORT
        value: 3333
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
